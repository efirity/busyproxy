# BusyProxy — performance-tuned nginx (TLS managed by Certbot)
# Install: copy server block into /etc/nginx/sites-available/busyproxy

upstream busyproxy_app {
  server 127.0.0.1:8080;
  keepalive 32;
}

# gzip (brotli optional if module installed)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/xml
  application/rss+xml
  image/svg+xml
  font/woff2;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  server_name busyproxy.net www.busyproxy.net app.busyproxy.net portal.busyproxy.net admin.busyproxy.net;

  client_max_body_size 20m;
  # Faster TLS resume
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Security + speed
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  # Long-cache fingerprinted assets (Vite /assets/*)
  location /assets/ {
    proxy_pass http://busyproxy_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  # Never cache API
  location /api/ {
    proxy_pass http://busyproxy_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    add_header Cache-Control "no-store" always;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://busyproxy_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    # Short cache for HTML shell (HMR-safe in early stage)
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  listen [::]:443 ssl ipv6only=on;
  listen 443 ssl;
  # Certbot manages ssl_certificate lines — keep existing cert paths when merging
}
